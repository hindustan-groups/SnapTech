<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>404 - Page Not Found | SnapTech Digital</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 1.5rem;
        padding: 2.5rem 2rem;
        max-width: 32rem;
        width: 100%;
        text-align: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      }
      .code {
        font-size: 5rem;
        font-weight: 900;
        line-height: 1;
        color: rgba(27, 110, 243, 0.15);
        margin-bottom: 1rem;
        letter-spacing: -0.05em;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 0.75rem;
      }
      p {
        font-size: 0.95rem;
        color: #475569;
        line-height: 1.5;
        margin-bottom: 2rem;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: 0.75rem;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-primary {
        background-color: #1b6ef3;
        color: #ffffff;
      }
      .btn-primary:hover {
        background-color: #1658c7;
      }
      .btn-secondary {
        background-color: #ffffff;
        color: #334155;
        border: 1px solid #cbd5e1;
      }
      .btn-secondary:hover {
        background-color: #f1f5f9;
      }
      .footer {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #f1f5f9;
        font-size: 0.75rem;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page or resource you are looking for does not exist or has been relocated. Let’s get you back to where you need to be.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Return to Homepage</a>
        <a href="/contact" class="btn btn-secondary">Contact Support</a>
      </div>
      <div class="footer">
        © SnapTech Digital. Technical division of Hindustan Projects Group.
      </div>
    </div>
  </body>
</html>
